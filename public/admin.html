<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Sixteen admin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Jost:wght@400;500&display=swap">
<style>
:root{--bg:#e6e6e5;--surface:#f4f4f3;--ink:#1e1f21;--mid:#5f6266;--line:#c4c5c7;--dark:#2a2c2f;--on-dark:#f0f0ef;--err:#9b2c2c;--ok:#2f6b3f;--blend:multiply;--inv:none;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#1a1b1d;--surface:#232528;--ink:#ececeb;--mid:#a0a3a7;--line:#3a3c40;--dark:#ececeb;--on-dark:#1a1b1d;--err:#f0a0a0;--ok:#8fd19e;--blend:screen;--inv:invert(1)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Jost,system-ui,sans-serif}
.logo{display:block;mix-blend-mode:var(--blend);filter:var(--inv)}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;margin:0;line-height:1.1}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.btn{font:500 15px Jost,sans-serif;padding:10px 22px;border-radius:999px;border:1px solid var(--dark);background:transparent;color:var(--ink);cursor:pointer}
.btn.fill{background:var(--dark);color:var(--on-dark)}
.btn.sm{padding:5px 14px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:wait}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 10px;width:100%}
label{display:block;font-size:14px;color:var(--mid);margin-bottom:4px}
.msg{min-height:1.4em;margin:8px 0 0;color:var(--mid)}.msg.err{color:var(--err)}.msg.ok{color:var(--ok)}
#login{max-width:380px;margin:12vh auto;padding:32px;background:var(--surface);border:1px solid var(--line);border-radius:8px;text-align:center}
#login .logo{width:110px;margin:0 auto 12px}
#login form{display:grid;gap:12px;text-align:left;margin-top:20px}
header{background:var(--surface);border-bottom:1px solid var(--line)}
.bar{max-width:1100px;margin:auto;padding:10px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.bar .logo{width:52px}
.tabs{display:flex;gap:6px;margin-left:16px}
.tab{font:500 15px Jost,sans-serif;padding:8px 18px;border-radius:999px;border:0;background:transparent;color:var(--mid);cursor:pointer}
.tab[aria-selected="true"]{background:var(--dark);color:var(--on-dark)}
.out{margin-left:auto}
main{max-width:1100px;margin:auto;padding:28px 20px 80px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 20px}
.chip{font:500 14px Jost,sans-serif;padding:6px 16px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--dark);color:var(--on-dark);border-color:var(--dark)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px 20px;margin-bottom:14px}
.row{display:flex;gap:16px;justify-content:space-between;flex-wrap:wrap}
.muted{color:var(--mid);font-size:14px}
.badge{display:inline-block;font-size:13px;padding:2px 10px;border-radius:999px;border:1px solid var(--line);margin-left:8px;vertical-align:middle}
.badge.new{background:var(--dark);color:var(--on-dark);border-color:var(--dark)}
.items{margin:10px 0;padding:10px 0;border-block:1px solid var(--line)}
.ctl{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
.ctl>div{min-width:150px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.thumb{width:64px;height:80px;border-radius:5px;background:var(--line);object-fit:cover;flex:none}
.plist{display:flex;gap:14px;align-items:center}
.plist .grow{flex:1;min-width:0}
.pv{width:120px;height:150px;border-radius:6px;object-fit:cover;background:var(--line);display:block;margin-top:8px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,0);background:var(--dark);color:var(--on-dark);padding:10px 20px;border-radius:999px;z-index:50}
[hidden]{display:none!important}
@media (max-width:700px){.grid2{grid-template-columns:1fr}.tabs{margin-left:0;width:100%}.out{margin-left:0}}
</style>
</head>
<body>

<section id="login" hidden>
<img class="logo" src="logo.png" alt="Sixteen">
<h1>Owner login</h1>
<form id="loginForm">
<div><label for="em">Email</label><input id="em" type="email" autocomplete="username" required></div>
<div><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required></div>
<button class="btn fill" type="submit">Log in</button>
<p class="msg" id="loginMsg" role="alert"></p>
</form>
</section>

<div id="app" hidden>
<header><div class="bar">
<img class="logo" src="logo.png" alt="Sixteen">
<div class="tabs" role="tablist">
<button class="tab" role="tab" data-t="orders" id="tabOrders">Orders</button>
<button class="tab" role="tab" data-t="products">Products</button>
<button class="tab" role="tab" data-t="messages">Messages</button>
</div>
<button class="btn sm out" id="logout" type="button">Log out</button>
</div></header>
<main>
<section id="orders" hidden>
<h2>Orders</h2>
<div class="chips" id="statusChips" role="group" aria-label="Filter orders"></div>
<div id="orderList"></div>
</section>

<section id="products" hidden>
<h2 id="formTitle">Add a product</h2>
<form class="card" id="pform" style="margin-top:16px">
<div class="grid2">
<div><label for="pn">Name</label><input id="pn" maxlength="120" required></div>
<div><label for="pc">Category</label><select id="pc"><option>Men</option><option>Women</option><option>Outerwear</option></select></div>
<div><label for="pp">Price (₹)</label><input id="pp" type="number" min="1" step="1" inputmode="numeric" required></div>
<div><label for="ps">Stock (pieces available)</label><input id="ps" type="number" min="0" step="1" inputmode="numeric" required></div>
</div>
<div style="margin-top:12px"><label for="pd">Description (fabric, fit, care)</label><textarea id="pd" rows="3" maxlength="1000"></textarea></div>
<div style="margin-top:12px"><label for="pf">Photo</label><input id="pf" type="file" accept="image/*">
<img class="pv" id="pv" alt="Photo preview" hidden>
<button class="btn sm" id="rmImg" type="button" hidden style="margin-top:8px">Remove photo</button></div>
<div class="ctl" style="margin-top:16px"><button class="btn fill" id="psave" type="submit">Save product</button><button class="btn" id="pcancel" type="button" hidden>Cancel editing</button></div>
<p class="msg" id="pmsg" role="status"></p>
</form>
<h2>All products</h2>
<div id="plist" style="margin-top:16px"></div>
</section>

<section id="messages" hidden>
<h2>Messages</h2>
<div id="mlist" style="margin-top:16px"></div>
</section>
</main>
</div>
<div id="toast" role="status" hidden></div>

<script>
var token = '', orders = [], products = [], editId = null, image = '', status = 'All', tt;
var STATUSES = ['new', 'confirmed', 'shipped', 'delivered', 'cancelled'];
var $ = function (s) { return document.querySelector(s); };
function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function rupees(n) { return '₹' + Number(n).toLocaleString('en-IN'); }
function say(t) { var x = $('#toast'); x.textContent = t; x.hidden = false; clearTimeout(tt); tt = setTimeout(function () { x.hidden = true; }, 2200); }
function when(s) { var d = new Date(s.replace(' ', 'T') + 'Z'); return isNaN(d) ? s : d.toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short' }); }

function api(url, opts) {
  opts = opts || {}; opts.headers = Object.assign({}, opts.headers, token ? { Authorization: 'Bearer ' + token } : {});
  return fetch(url, opts).then(function (r) {
    return r.json().catch(function () { return {}; }).then(function (d) {
      if (r.status === 401 && token) { logout(); throw new Error('Please log in again.'); }
      if (!r.ok) throw new Error(d.error || 'Something went wrong.');
      return d;
    });
  });
}
function send(method, url, body) {
  return api(url, { method: method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
}

/* ---------- login ---------- */
function show(loggedIn) { $('#login').hidden = loggedIn; $('#app').hidden = !loggedIn; }
function logout() { token = ''; try { sessionStorage.removeItem('sixteen-admin'); } catch (e) {} show(false); }
$('#logout').onclick = logout;
$('#loginForm').onsubmit = function (e) {
  e.preventDefault(); var m = $('#loginMsg'); m.className = 'msg'; m.textContent = 'Logging in…';
  send('POST', '/api/admin/login', { email: $('#em').value, password: $('#pw').value }).then(function (d) {
    token = d.token; try { sessionStorage.setItem('sixteen-admin', token); } catch (x) {}
    $('#pw').value = ''; m.textContent = ''; start();
  }).catch(function (err) { m.className = 'msg err'; m.textContent = err.message; });
};

/* ---------- tabs ---------- */
function tab(t) {
  ['orders', 'products', 'messages'].forEach(function (n) { $('#' + n).hidden = n !== t; });
  document.querySelectorAll('.tab').forEach(function (b) { b.setAttribute('aria-selected', b.dataset.t === t); });
  if (t === 'orders') loadOrders(); if (t === 'products') loadProducts(); if (t === 'messages') loadMessages();
}
document.querySelectorAll('.tab').forEach(function (b) { b.onclick = function () { tab(b.dataset.t); }; });
function start() { show(true); tab('orders'); }

/* ---------- orders ---------- */
function chips() {
  var box = $('#statusChips'); box.replaceChildren();
  ['All'].concat(STATUSES).forEach(function (s) {
    var b = el('button', 'chip', s === 'All' ? 'All' : s.charAt(0).toUpperCase() + s.slice(1)); b.type = 'button';
    b.setAttribute('aria-pressed', s === status); b.onclick = function () { status = s; loadOrders(); }; box.appendChild(b);
  });
}
function loadOrders() {
  chips();
  api('/api/admin/orders' + (status === 'All' ? '' : '?status=' + status)).then(function (list) {
    orders = list; var box = $('#orderList'); box.replaceChildren();
    if (!list.length) box.appendChild(el('p', 'muted', 'No orders here yet.'));
    list.forEach(function (o) { box.appendChild(orderCard(o)); });
    if (status === 'All') { var n = list.filter(function (o) { return o.status === 'new'; }).length; $('#tabOrders').textContent = n ? 'Orders (' + n + ' new)' : 'Orders'; }
  }).catch(function (e) { say(e.message); });
}
function pick(options, value, onchange, label) {
  var s = el('select'); s.setAttribute('aria-label', label);
  options.forEach(function (o) { var x = el('option', null, o.charAt(0).toUpperCase() + o.slice(1)); x.value = o; s.appendChild(x); });
  s.value = value; s.onchange = onchange; return s;
}
function patch(o, body, msg) {
  send('PATCH', '/api/admin/orders/' + o.id, body).then(function () { say(msg); loadOrders(); }).catch(function (e) { say(e.message); loadOrders(); });
}
function orderCard(o) {
  var c = el('article', 'card');
  var top = el('div', 'row'), h = el('h3', null, 'Order #' + o.id);
  var b = el('span', 'badge' + (o.status === 'new' ? ' new' : ''), o.status); h.appendChild(b);
  top.appendChild(h); top.appendChild(el('strong', null, rupees(o.total))); c.appendChild(top);
  c.appendChild(el('div', 'muted', when(o.created_at) + ' · ' + (o.payment_method === 'cod' ? 'Cash on delivery' : 'Online payment')));
  var who = el('p'); who.style.margin = '10px 0 0'; who.appendChild(el('strong', null, o.customer_name + ' '));
  var tel = el('a', null, o.phone); tel.href = 'tel:' + o.phone.replace(/[^\d+]/g, ''); who.appendChild(tel);
  if (o.email) who.appendChild(el('span', 'muted', ' · ' + o.email));
  c.appendChild(who); c.appendChild(el('div', 'muted', o.address));
  var it = el('div', 'items');
  o.items.forEach(function (i) { it.appendChild(el('div', null, i.name + (i.size ? ' (' + i.size + ')' : '') + ' × ' + i.qty + ' — ' + rupees(i.price * i.qty))); });
  c.appendChild(it);
  var ctl = el('div', 'ctl'), a = el('div'), p = el('div');
  a.appendChild(el('label', null, 'Order status'));
  a.appendChild(pick(STATUSES, o.status, function (e) {
    var v = e.target.value;
    if (v === 'cancelled' && !confirm('Cancel order #' + o.id + '? The stock will go back to the shop.')) { e.target.value = o.status; return; }
    patch(o, { status: v }, 'Order #' + o.id + ' is now ' + v);
  }, 'Order status'));
  p.appendChild(el('label', null, 'Payment'));
  p.appendChild(pick(['pending', 'paid', 'refunded'], o.payment_status, function (e) { patch(o, { paymentStatus: e.target.value }, 'Payment updated'); }, 'Payment status'));
  ctl.appendChild(a); ctl.appendChild(p); c.appendChild(ctl);
  return c;
}

/* ---------- products ---------- */
function setImage(url) {
  image = url || ''; var pv = $('#pv'); pv.hidden = !image; if (image) pv.src = image; $('#rmImg').hidden = !image;
}
function resetForm() {
  editId = null; $('#pform').reset(); setImage(''); $('#formTitle').textContent = 'Add a product'; $('#pcancel').hidden = true; $('#pmsg').textContent = '';
}
$('#pcancel').onclick = resetForm; $('#rmImg').onclick = function () { setImage(''); $('#pf').value = ''; };

// Shrinks the photo in the browser first so uploads are quick and pages load fast.
$('#pf').onchange = function () {
  var f = this.files[0]; if (!f) return; var m = $('#pmsg'); m.className = 'msg'; m.textContent = 'Uploading photo…';
  var img = new Image(), u = URL.createObjectURL(f);
  img.onload = function () {
    var k = Math.min(1, 1100 / Math.max(img.width, img.height)), cv = document.createElement('canvas');
    cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(u);
    cv.toBlob(function (blob) {
      api('/api/admin/upload', { method: 'POST', headers: { 'Content-Type': 'image/jpeg' }, body: blob })
        .then(function (d) { setImage(d.url); m.className = 'msg ok'; m.textContent = 'Photo added. Press Save product to finish.'; })
        .catch(function (e) { m.className = 'msg err'; m.textContent = e.message; });
    }, 'image/jpeg', 0.85);
  };
  img.onerror = function () { m.className = 'msg err'; m.textContent = 'That file could not be read as a photo.'; };
  img.src = u;
};

$('#pform').onsubmit = function (e) {
  e.preventDefault(); var m = $('#pmsg'), btn = $('#psave'); btn.disabled = true; m.className = 'msg'; m.textContent = 'Saving…';
  var body = { name: $('#pn').value, category: $('#pc').value, price: Number($('#pp').value), stock: Number($('#ps').value), description: $('#pd').value, image: image };
  (editId ? send('PUT', '/api/admin/products/' + editId, body) : send('POST', '/api/admin/products', body))
    .then(function () { say(editId ? 'Product updated' : 'Product added'); resetForm(); loadProducts(); })
    .catch(function (err) { m.className = 'msg err'; m.textContent = err.message; })
    .then(function () { btn.disabled = false; });
};
function edit(p) {
  editId = p.id; $('#pn').value = p.name; $('#pc').value = p.category; $('#pp').value = p.price; $('#ps').value = p.stock; $('#pd').value = p.description;
  setImage(p.image); $('#formTitle').textContent = 'Edit product'; $('#pcancel').hidden = false; window.scrollTo({ top: 0, behavior: 'smooth' });
}
function loadProducts() {
  api('/api/admin/products').then(function (list) {
    products = list; var box = $('#plist'); box.replaceChildren();
    if (!list.length) box.appendChild(el('p', 'muted', 'No products yet. Add your first one above.'));
    list.forEach(function (p) {
      var c = el('div', 'card plist');
      if (p.image) { var im = el('img', 'thumb'); im.src = p.image; im.alt = p.name; c.appendChild(im); } else c.appendChild(el('div', 'thumb'));
      var g = el('div', 'grow'), t = el('strong', null, p.name);
      if (!p.active) t.appendChild(el('span', 'badge', 'Hidden'));
      if (p.active && p.stock < 1) t.appendChild(el('span', 'badge', 'Sold out'));
      g.appendChild(t); g.appendChild(el('div', 'muted', p.category + ' · ' + rupees(p.price) + ' · ' + p.stock + ' in stock')); c.appendChild(g);
      var e = el('button', 'btn sm', 'Edit'), h = el('button', 'btn sm', p.active ? 'Hide' : 'Show'); e.type = h.type = 'button';
      e.onclick = function () { edit(p); };
      h.onclick = function () {
        (p.active ? send('DELETE', '/api/admin/products/' + p.id)
          : send('PUT', '/api/admin/products/' + p.id, { name: p.name, category: p.category, price: p.price, stock: p.stock, description: p.description, image: p.image, active: 1 }))
          .then(function () { say(p.active ? 'Product hidden from the shop' : 'Product is live again'); loadProducts(); }).catch(function (x) { say(x.message); });
      };
      c.appendChild(e); c.appendChild(h); box.appendChild(c);
    });
  }).catch(function (e) { say(e.message); });
}

/* ---------- messages ---------- */
function loadMessages() {
  api('/api/admin/messages').then(function (list) {
    var box = $('#mlist'); box.replaceChildren();
    if (!list.length) box.appendChild(el('p', 'muted', 'No messages yet.'));
    list.forEach(function (m) {
      var c = el('article', 'card'), r = el('div', 'row'); r.appendChild(el('strong', null, m.name));
      r.appendChild(el('span', 'muted', when(m.created_at))); c.appendChild(r);
      var a = el('a', 'muted', m.email); a.href = 'mailto:' + m.email; c.appendChild(a);
      var p = el('p', null, m.message); p.style.whiteSpace = 'pre-wrap'; c.appendChild(p); box.appendChild(c);
    });
  }).catch(function (e) { say(e.message); });
}

try { token = sessionStorage.getItem('sixteen-admin') || ''; } catch (e) {}
if (token) start(); else show(false);
</script>
</body>
</html>
